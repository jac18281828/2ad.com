<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Diagram of how a seed code builds the maze. The seed code hashes into a world key. One hash of the key, a tag and coordinates gives each value: which way a tomb exits, where a door sits in a wall and how a room's passages branch. Two neighbouring rooms both read the door hash for their shared wall, so the door lines up on both sides.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="440" rx="10" fill="#f8fafc"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1e293b" text-anchor="middle">

    <!-- pipeline -->
    <g stroke="#475569" stroke-width="2.5" fill="none">
      <path d="M190,55 L248,55" marker-end="url(#arrow)"/>
      <path d="M450,55 L508,55" marker-end="url(#arrow)"/>
      <path d="M600,90 C600,120 165,110 165,146" marker-end="url(#arrow)"/>
      <path d="M625,90 L455,146" marker-end="url(#arrow)"/>
      <path d="M650,90 C650,120 745,110 745,146" marker-end="url(#arrow)"/>
      <path d="M455,212 L455,276" marker-end="url(#arrow)"/>
    </g>
    <g stroke="#475569" stroke-width="2" fill="#e2e8f0">
      <rect x="20" y="20" width="170" height="70" rx="8"/>
      <rect x="250" y="20" width="200" height="70" rx="8"/>
      <rect x="510" y="20" width="230" height="70" rx="8"/>
      <rect x="40" y="150" width="250" height="62" rx="8"/>
      <rect x="330" y="150" width="250" height="62" rx="8"/>
      <rect x="620" y="150" width="250" height="62" rx="8"/>
    </g>
    <g stroke="none">
      <text x="105" y="50" font-size="19" font-weight="bold">seed code</text>
      <text x="105" y="74" font-size="15" font-family="Menlo, Consolas, monospace">K7Q2-M9XA</text>
      <text x="350" y="50" font-size="19" font-weight="bold">WORLD</text>
      <text x="350" y="74" font-size="14" font-family="Menlo, Consolas, monospace">SHA3(v1 ‖ code)</text>
      <text x="625" y="50" font-size="19" font-weight="bold">H(tag, x, y)</text>
      <text x="625" y="74" font-size="14" font-family="Menlo, Consolas, monospace">SHA3(WORLD ‖ tag ‖ x ‖ y)</text>

      <text x="165" y="176" font-size="15" font-family="Menlo, Consolas, monospace">H("exit", tomb)</text>
      <text x="165" y="198" font-size="15">which way a tomb exits</text>
      <text x="455" y="176" font-size="15" font-family="Menlo, Consolas, monospace">H("door", wall)</text>
      <text x="455" y="198" font-size="15">where a door sits in a wall</text>
      <text x="745" y="176" font-size="15" font-family="Menlo, Consolas, monospace">H("cells", room)</text>
      <text x="745" y="198" font-size="15">how a room's passages branch</text>
    </g>

    <!-- seam -->
    <g stroke="#475569" stroke-width="2" fill="#e2e8f0">
      <rect x="285" y="280" width="170" height="130"/>
      <rect x="455" y="280" width="170" height="130"/>
    </g>
    <rect x="447" y="325" width="16" height="45" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <g stroke="none">
      <text x="370" y="352" font-size="20" font-weight="bold">room A</text>
      <text x="540" y="352" font-size="20" font-weight="bold">room B</text>
      <text x="475" y="250" font-size="16" font-style="italic" text-anchor="start">both rooms read it</text>
    </g>
  </g>
</svg>
